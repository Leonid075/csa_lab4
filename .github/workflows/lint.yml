name: lint

on:
  push:
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: setup
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: lint
        run: ruff check .

      - name: format
        run: ruff format --check .
